<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Bags</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">JACK SPADE</h1>
    <nav class="nav">
      <a href="#">New Arrivals</a>
      <a href="#">Bags</a>
      <a href="#">Clothing</a>
      <a href="#">Wallets</a>
      <a href="#">Sale</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-text">
        <p class="fact">FACT:</p>
        <h2>
          Security lines are 99% more bearable<br>
          when you have the right bags.
        </h2>
        <button class="btn-outline">SHOP TRAVEL</button>
      </div>

      <div class="hero-image">
        <img 
          src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f"
          alt="Travel Bag"
        />
      </div>
    </div>

    <p class="note">
      *Based on an unofficial office poll.<br>
      (We asked some guys.)
    </p>
  </section>

  <!-- OFFER -->
  <section class="offer">
    <div class="offer-box">
      <h2>WE GOT YOU SOMETHING.</h2>
      <p>
        Take an extra <strong>30% off</strong> sale items<br>
        with code <strong>EXTRA</strong> at checkout
      </p>
      <button class="btn-black">SHOP NOW</button>
      <span class="expiry">Ends 12/26/16 at 11:59 PM</span>
    </div>
  </section>

</body>
</html>
