<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Valentine's Day</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="poster">

    <h1 class="title-main">HAPPY</h1>

      <img
        src="https://images.unsplash.com/photo-1544145945-f90425340c7e"

    <div class="info">
      <div class="left">
        <p class="label">START AT</p>
        <h4>9PM</h4>
        <ul>
          <li>Live Music</li>
          <li>Special Show</li>
          <li>Deejay</li>
          <li>Fireworks</li>
        </ul>
      </div>

      <div class="right">
        <p class="label">SEE YOU ON</p>
        <h4>FEB. 14th</h4>
        <ul>
          <li>Free Drinks</li>
          <li>Fresh Cherry</li>
          <li>Cocktails</li>
          <li>Gifts</li>
        </ul>
      </div>
    </div>

    <footer class="footer">Creativeflyers</footer>
