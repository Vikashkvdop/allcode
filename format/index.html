<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teavana Sale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="email-container">
    <!-- Header -->
    <header class="header">
      <h1 class="brand">TEAVANA</h1>
    </header>

    <!-- Hero Section main sections -->
    <section class="hero">
      <h2>30% OFF</h2>
      <p class="subtitle">FRIENDS & FAM FINALE</p>

      <div class="products">
        <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574" alt="Tea 1">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" alt="Tea 2">
        <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348" alt="Tea 3">
      </div>

      <!-- Countdown -->
      <div class="countdown">
        <div><span id="days">00</span><small>DAYS</small></div>
        <div><span id="hours">00</span><small>HOURS</small></div>
        <div><span id="minutes">00</span><small>MINS</small></div>
        <div><span id="seconds">00</span><small>SECS</small></div>
      </div>

      <a href="#" class="btn">SHOP NOW</a>
    </section>

    <!-- Footer Section -->
    <section class="footer">
      <h3>THERE’S A TEA FOR THAT</h3>
      <p>
        These online-exclusive samplers are a delicious way to support your goals.
      </p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
