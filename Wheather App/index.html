<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>Weather App</h1>

        <div class="tab-container">
            <p class="tab" data-userWeather>Your Weather</p>
            <p class="tab" data-searchWeather>Search Weather</p>
        </div>

        <div class="weather-container">
            <!-- grant location container -->
            <div class="sub-container grant-location-container">
                <img src="images/location.png" alt="" width="80" height="80" loading="lazy">
                <p>Grant Location Access</p>
                <p>Allow Access to get weather inforamation</p>
                <button class="btn" data-grantAccess>Grant Access</button>
            </div> 

            <!-- search form -> form container -->
            <form class="form-container" data-searchForm>
                <input placeholder="search for city..." data-searchInput>
                <button class="btn" type="submit">
                    <img src="images/search.png" width="20" height="20" loading="lazy" alt="">
                </button>
            </form> 

            <!-- loading screen container -->
            <div class="sub-container loading-container">
                <img src="images/loading.gif" width="150" height="150" alt="">
                <p>Loading</p>

            </div> 

            <!-- show weather info -->
            <div class="sub-container user-info-container">
                <!-- city name and Flag -->
                <div class="name">
                    <p data-cityName></p>
                    <img data-countryIcon>
                </div> 

                <!-- weather description -->
                <p data-weatherDesc></p>
                <!--weather Icon  -->
                <img data-weatherIcon>
                <!-- temperature -->
                <p data-temp></p> 

                <!-- cards parameters -->
                <div class="parameter-container">
                    <!-- card 1 -->
                    <div class="parameter">
                        <img src="images/wind.png" alt="">
                        <p>Windspeed</p>
                        <p data-windspeed></p>
                    </div> 

                    <!-- card 2 -->
                    <div class="parameter">
                        <img src="images/humidity.png" alt="">
                        <p>humidity</p>
                        <p data-humidity></p>
                    </div> 

                    <!-- card 3 -->
                    <div class="parameter">
                        <img src="images/cloud.png" alt="">
                        <p>Cloud</p>
                        <p data-cloudiness></p>
                    </div> 
                </div> 
            </div> 
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
