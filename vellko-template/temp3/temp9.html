<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification</title>
</head>

<body style="margin:0; padding:0; background:#eef2f7; font-family:Arial, sans-serif;">

<div style="max-width:600px; margin:30px auto;">

<!-- Header -->
<div style="background:#111827; color:#fff; padding:20px; border-radius:6px 6px 0 0;">
<h3 style="margin:0;">Verification Required</h3>
</div>

<!-- Body -->
<div style="background:#ffffff; padding:25px; border-radius:0 0 6px 6px;">

<p>Hello {{first_name}},</p>

<p style="color:#555;">
We’ve received your request and it is being processed. Kindly review and confirm your details to proceed further.
</p>

<div style="border:1px solid #e5e7eb; padding:15px; margin:20px 0;">
<p><strong>Name:</strong> {{first_name}} {{last_name}}</p>
<p><strong>Email:</strong> {{email}}</p>
<p><strong>Date:</strong> {{ocx_month_name}} {{ocx_day}}</p>
</div>

<a href="#" style="display:block; text-align:center; background:#111827; color:#fff; padding:12px; text-decoration:none;">
Review Details
</a>

</div>
</div>

</body>
</html>
