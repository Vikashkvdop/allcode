<!DOCTYPE html>
<html lang="en">
<head>

        <tr>
            <td style="padding: 30px;">
                <p style="font-size: 16px; color: #111827; margin: 0 0 10px 0; font-weight: 600;">Almost there, {{first_name}}.</p>

                </p>

                <table width="100%" style="margin-bottom: 25px; background-color: #fcfcfc; border-radius: 12px; border: 1px solid #f1f5f9;">

                            <strong>User:</strong> {{first_name}} {{last_name}}<br>

                        <td style="padding: 15px; text-align: right;">
                            <a href="#" style="color: #2563eb; font-size: 13px; font-weight: bold; text-decoration: none;">EDIT →</a>
                        </td>
                    </tr>
                </table>

                <a href="#" style="background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; display: block; text-align: center; font-size: 15px;">Confirm & Finalize Now</a>
                
                <div style="text-align: center; margin-top: 20px;">
                    <span style="font-size: 11px; color: #94a3b8; background-color: #f8fafc; padding: 4px 10px; border-radius: 4px;">ID: {{ocx_day}}-{{first_name|upper}}</span>
                </div>
            </td>
        </tr>
    </table>
