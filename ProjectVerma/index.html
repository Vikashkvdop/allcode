<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Food &amp;Groceries. Discover the best restaurants. Swiggy it!</title>
  <link rel="icon" href="image/Swiggy-logo.png" type="image/x-icon">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="w-full relative overflow-x-hidden" >
      <!-- nav bar -->
       <header class="relative bg-[#ff5200] flex font-bold">
        <div class="mt-8 ml-30 ">
          <img src="image/Swiggy_logo_bml6he.png" alt="" width="150px" height="150px">
        </div>

        <ul class="flex relative mt-10 text-white gap-7 ml-65 cursor-pointer list ">
          <li Swiggy-corporate onclick="swiggyCorporate">Swiggy Corporate</li>

          <li partner>
            Partner with us
          </li>
        </ul>

        <div class="mt-6 pl-10 ">
          <button class="text-white border rounded-lg p-2  "> Get the App
            <i class="fa-solid fa-arrow-up-right-dots"></i>
          </button>


          <button class="ml-8 text-white bg-[black]  pl-8 pr-8 pt-3 pb-3 rounded-lg font-semibold cursor-pointer space-x-0.5">
            Sign in
          </button>
        </div>

        

       </header>

      <!-- below header section -->
       <section class="bg-[#ff5200] relative w-full">

        <div class="absolute ">
          <img src="image/Veggies_new.avif" alt="" width="200px" height="200px">

          <img src="image/Sushi_replace.avif" alt="" width="200px" height="200px" class="ml-[1021px] -mt-100">
        </div>

        <div class="Description">
          <div class="">Order food &amp;groceries. Discover best restaurants. Swiggy it!</div>
        </div>

        <div class="flex justify-around mt-6">
          <div class="flex z-10">
          <input type="text" placeholder="Enter your delivery location"
          class="bg-white rounded-lg h-[55px] w-[300px] p-3 font-sans  " id="location" >
          <i class="fa-solid fa-location-dot" id="location-icon"></i>
          </div>

          <div class="flex z-10">
            <input type="text" placeholder="Search for restaurants and more items"
          class="bg-[#fff] rounded-lg h-[55px] w-[400px] p-3 font-sans -ml-110 "
          >
          <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
          </div>
        </div>


        <div class="flex w-[1000px] h-[500px] mt-8 ml-30">
          <div>
            <img src="image/instamart-delivery.avif" alt="" height="170px" width="400px">
           <div class="-mt-20 ml-15 food-icon " >
            <i class="fa-solid fa-arrow-right" ></i>
           </div>
          </div>

          <div>
            <img src="image/dine out.avif" alt="" height="170px" width="400px">
            <div class="-mt-20 ml-15 food-icon" >
              <i class="fa-solid fa-arrow-right" ></i>
             </div>
          </div>

          <div>
            <img src="image/genie.avif" alt="" height="170px" width="400px">
            <div class="-mt-20 ml-15 food-icon" >
              <i class="fa-solid fa-arrow-right" ></i>
             </div>
          </div>
        </div>

        <!-- <div class="w-[1200px] h-[20px] bg-[#fff] -mt-20"></div> -->

       </section>
    </div>
 
    <script src="index.js"></script>
</body>
</html>
